[project]
name = "personaltracker"
version = "0.1.0"
description = "NextRole -- an AI career coach that builds a sourced skill roadmap for a target role, tracks progress against it, and validates it against real job postings."
readme = "README.md"
authors = [
    { name = "Mauryaraheja", email = "mraheja_be24@thapar.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "groq>=1.7.0",
    "pdf2image>=1.17.0",
    "pypdf>=6.17.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
    "tavily-python>=0.8.1",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "personaltracker"
